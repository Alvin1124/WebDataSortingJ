<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Sorting</title>
</head>
<body>
    <h1>File Sorting Application</h1>

    <form id="uploadForm">
        <label for="processType">Select Process:</label>
        <select id="processType" name="processType">
            <option value="dispatch">Dispatch</option>
            <option value="scandetail">Scan Detail</option>
        </select>
        <br><br>

        <label for="files">Select Files:</label>
        <input type="file" id="files" name="files" multiple required>
        <br><br>

        <button type="button" onclick="uploadAndSort()">Upload & Sort</button>
    </form>

    <pre id="response"></pre>

    <script>
        // Login disabled for now

        */

        async function uploadAndSort() {
            const processType = document.getElementById("processType").value;
            const files = document.getElementById("files").files;

            if (files.length === 0) {
                alert("Please select files to upload.");
                return;
            }

            const formData = new FormData();
            for (const file of files) {
                formData.append("files", file);
            }

            const endpoint = processType === "dispatch" ? "/Sort/sortdispatch" : "/Sort/sortscandetail";

            const response = await fetch(endpoint, {
                method: 'POST',
                // Auth header removed
                body: formData
            });

            const data = await response.json();
            document.getElementById("response").innerText = JSON.stringify(data, null, 2);
        }
    </script>

    <!-- Login temporarily disabled -->

</body>
</html>
